name: Mobile Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  mobile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - run: npm install
      - run: npx wdio --version
      - run: npx wdio config --help